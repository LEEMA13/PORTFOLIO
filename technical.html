<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical Environment</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #e8dfcf;
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-size: 36px;
        font-weight: bold;
        font-style: italic;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        gap: 50px;
        margin-top: 20px;
      }
      .image-container img {
        width: 400px;
        height: auto;
        border: 2px solid black;
      }
      .button-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .button {
        background-color: black;
        color: white;
        font-size: 18px;
        font-style: italic;
        font-weight: bold;
        padding: 15px 30px;
        border-radius: 25px;
        border: 2px solid white;
        cursor: pointer;
        transition: 0.3s;
        text-decoration: none;
      }
      .button:hover {
        background-color: white;
        color: black;
      }
    </style>
  </head>
  <body>
    <h1>TECHNICAL ENVIRONMENT</h1>
    <div class="container">
      <div class="image-container">
        <img src="images/technical.jpg" alt="Technical Environment Image" />
      </div>
      <div class="button-container">
        <a href="competency.html" class="button">TECHNICAL COMPETENCIES</a>
        <a href="creative.html" class="button">CREATIVE DESIGNER</a>
      </div>
    </div>
  </body>
</html>
