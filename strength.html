<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strengthy Person</title>
    <style>
      body {
        background-color: #e5dbd1;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .title {
        font-size: 36px;
        font-weight: bold;
        font-family: cursive;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 80%;
        background-color: white;
        padding: 10px;
        border: 3px solid black;
        border-radius: 10px;
        box-shadow: 5px 5px black;
        position: relative;
      }
      .arrow {
        flex-grow: 1;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        font-family: cursive;
        text-align: center;
      }
      .image-box {
        width: 100px;
        height: 100px;
        border: 3px solid black;
      }
      .image-box img {
        width: 100%;
        height: 100%;
        border-radius: 5px;
      }
      .reverse {
        flex-direction: row-reverse;
      }
    </style>
  </head>
  <body>
    <div class="title">STRENGTHY PERSON</div>
    <div class="container">
      <div class="row">
        <div class="arrow">POSITIVE AND CREATIVE THINKER</div>
        <div class="image-box">
          <img src="images/positive.jpeg" alt="Creative Thinker" />
        </div>
      </div>
      <div class="row reverse">
        <div class="arrow">HARD AND SMART WORKER</div>
        <div class="image-box">
          <img src="images/SMART.png" alt="Smart Worker" />
        </div>
      </div>
      <div class="row">
        <div class="arrow">QUICK AND EFFICIENT LEARNER</div>
        <div class="image-box">
          <img src="images/LEARNING.jpg" alt="Efficient Learner" />
        </div>
      </div>
      <div class="row reverse">
        <div class="arrow">GREAT AND EFFICIENT TIME MANAGER</div>
        <div class="image-box">
          <img src="images/TIME.avif" alt="Time Manager" />
        </div>
      </div>
    </div>
  </body>
</html>
